# Puente Salud · ejecución local completa: docker compose up --build
# Solo se publican el gateway (API) y los dos frontends. La base y los servicios internos usan la red privada.
name: puente-salud

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      retries: 30
    networks: [interna]

  seed:
    build:
      context: .
      dockerfile: scripts/Dockerfile.seed
    environment:
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL}
      APP_DB_USER: ${APP_DB_USER}
      FECHA_REFERENCIA: ${FECHA_REFERENCIA:-}
    depends_on:
      db: { condition: service_healthy }
    networks: [interna]
    restart: "no"

  territorio:
    build: ./services/territorio
    environment:
      DATABASE_URL: ${DATABASE_URL}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      PORT: 8002
    depends_on:
      seed: { condition: service_completed_successfully }
    networks: [interna]

  seguimiento:
    build: ./services/seguimiento
    environment:
      DATABASE_URL: ${DATABASE_URL}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      FECHA_REFERENCIA: ${FECHA_REFERENCIA:-}
      PORT: 8001
    depends_on:
      seed: { condition: service_completed_successfully }
    networks: [interna]

  gateway:
    build: ./services/gateway
    environment:
      TOKEN_SECRET: ${TOKEN_SECRET}
      TOKEN_HORAS: ${TOKEN_HORAS:-8}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      CORS_ORIGINS: ${CORS_ORIGINS}
      DEMO_USERS: ${DEMO_USERS}
      SEGUIMIENTO_URL: http://seguimiento:8001
      TERRITORIO_URL: http://territorio:8002
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      seguimiento: { condition: service_healthy }
      territorio: { condition: service_healthy }
    networks: [interna]

  web-ciudadania:
    build:
      context: ../puente-salud-web-ciudadania
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:8080"
    depends_on: [gateway]
    networks: [interna]

  web-institucion:
    build:
      context: ../puente-salud-web-institucion
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5174:8080"
    depends_on: [gateway]
    networks: [interna]

volumes:
  pgdata:

networks:
  interna:
